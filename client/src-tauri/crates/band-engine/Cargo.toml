[package]
name = "band-engine"
version = "0.1.0"
description = "band 실시간 합주 엔진(장치 I/O·RT 경로·워커·네트워크·녹음·제어 평면)"
authors = ["Band Team"]
license = "MIT"
edition = "2021"
publish = false

# 엔진 R-1 ⑩-2(docs/overhaul/engine-stage5-10-scope.md 7.2·7.4절): 앱(`band`, Tauri)과 결정적 코어(`band-dsp`) 사이.
# tauri·플러그인에 의존하지 않는다. 장치 백엔드(`cpal`, `windows`)는 피처 뒤에 있다(기본 켬) — 하네스·시험은
# `default-features = false`로 백엔드 없이 쓴다(`tests/architecture.rs`의 `engine_crate_deps_follow_graph`가 고정한다).
[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
# 결정적 코어(코덱·지터·믹서·패킷 등, 엔진 R-1 ⑩-1)
band-dsp = { path = "../band-dsp" }

# Audio I/O: cpal(WASAPI 공유·ASIO). `backend-cpal` 피처 뒤.
cpal = { version = "0.15", optional = true }
# ringbuf는 측정·미디어 포트·녹음 링도 쓴다.
ringbuf = "0.4"
# 지연 측정 상호상관(P1-1). rubato(band-dsp)가 이미 쓰는 버전이다.
rustfft = "6"

# Network / crypto
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
if-addrs = "0.13"
# 오디오 소켓 IP_TOS(DSCP EF) 설정(P1-3). Cargo.lock에 이미 있는 버전이다.
socket2 = "0.6"
# 피어 쌍별 키 합의 (X25519 ECDH + HKDF-SHA256)
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"

# Utilities
parking_lot = "0.12"
# 진단 내보내기(P2-5): zip 작성, 로그 마스킹
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
regex = "1"
# 녹음 FLAC 저장(P2-4a): 순수 Rust 인코더(Apache-2.0). 기본 피처(par 스레드·serde·log)는 끔 — 쓰기 스레드에서 블록 단위로만 쓴다.
flacenc = { version = "0.5", default-features = false }

[target.'cfg(windows)'.dependencies]
# 워커/수신 스레드 MMCSS("Pro Audio") 등록, 엔진 실행 중 타이머 해상도 1ms(timeBeginPeriod)
# + 오디오 소켓 DSCP 마킹(qWAVE, P1-3) + 코어 배치 기록(CPU set·현재 프로세서, P1-21). 백엔드와 무관하게 쓴다(sys::prio·sys::cpu·sys::placement·net::qos).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Media", "Win32_System_Threading", "Win32_System_Kernel", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming", "Win32_NetworkManagement_QoS", "Win32_Networking_WinSock", "Win32_System_IO"] }
# 자체 WASAPI 백엔드(독점 이벤트 모드, IAudioClient3 저지연 공유 모드). `backend-wasapi` 피처 뒤. 0.62는 Tauri가 이미 쓰는 버전이다.
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
# FLAC 녹음 파일을 표준 디코더로 다시 읽어 비교(P2-4a)
claxon = "0.4"
# FLAC STREAMINFO MD5를 인코더와 따로 계산해 비교(PR #62 L2). flacenc가 이미 쓰는 크레이트다.
md-5 = "0.10"
# 릴레이 폴백 통합 테스트(tests/relay.rs): 실제 릴레이를 같은 프로세스에서 띄운다
band-relay = { path = "../../../../relay" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time"] }
# 녹음 WAV(EXTENSIBLE 헤더)를 표준 파서로 다시 읽어 확인(PR #47 L3)
hound = "3.5"
# 자기 자신을 개발 의존으로(엔진 R-1 ⑨a, ⑩-2에서 앱에서 옮김): 테스트·예제 타깃이 들어가는 빌드(`cargo test`, `--all-targets`,
# `--example`)는 늘 `test-support`가 켜진다. `default-features = false`라 백엔드 피처는 더하지 않는다 — `--no-default-features
# --features test-support`로 백엔드 없는 시험 빌드가 된다(7.4절). 테스트 타깃이 없는 제품 구성(`cargo build`,
# `cargo clippy --lib --bins`)에는 합쳐지지 않는다(피처 리졸버 2).
band-engine = { path = ".", default-features = false, features = ["test-support"] }

[features]
default = ["backend-cpal", "backend-wasapi"]
# cpal 백엔드(WASAPI 공유·ASIO): `engine::device::cpal`, 그리고 그것을 폴백으로 쓰는 `engine::device::select`(`SystemBackend`).
backend-cpal = ["dep:cpal"]
# 자체 WASAPI 백엔드(독점·IAudioClient3 저지연 공유): Windows에서만 `engine::wasapi`(`cfg(all(windows, feature = "backend-wasapi"))`).
# 다른 OS에서는 켜도 아무것도 더하지 않는다(`windows`가 cfg(windows) 의존이다).
backend-wasapi = ["dep:windows"]
# ASIO 지원 (CPAL_ASIO_DIR에 Steinberg ASIO SDK 필요). cpal 백엔드를 켠다. `band-dsp/asio`는 `DriverKind::supported()` 목록 플래그.
asio = ["backend-cpal", "cpal/asio", "band-dsp/asio"]
# 통합 테스트·예제·측정 도구용 내부(`band_engine::testing`, 가짜 장치 `engine::device::fake`, 워커 반복 시간 기록).
# 위 개발 의존(자기 자신)이 테스트·예제 빌드에서 늘 켠다 — `--features test-support`를 따로 줄 필요가 없다.
# 제품 구성에서 꺼지는지는 CI `Clippy (제품 구성)` 단계(`cargo clippy --lib --bins`)가 지킨다.
test-support = ["band-dsp/test-support"]

# 예제는 실제 장치를 연다(`SystemBackend` = cpal 폴백, `wasapi_probe`는 자체 WASAPI도). 백엔드 없는 구성에서는 건너뛴다.
[[example]]
name = "measure_smoke"
required-features = ["backend-cpal"]

[[example]]
name = "wasapi_probe"
required-features = ["backend-cpal", "backend-wasapi"]
