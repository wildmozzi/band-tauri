[package]
name = "band"
version = "0.1.0"
description = "Real-time music collaboration app"
authors = ["Band Team"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "band_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# Audio I/O (WASAPI 기본, ASIO는 `asio` 피처로 옵트인)
cpal = "0.15"
opus = "0.3"
ringbuf = "0.4"
rubato = "0.16"
# 지연 측정 상호상관(P1-1). rubato가 이미 쓰는 버전이다.
rustfft = "6"

# Network / crypto
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
if-addrs = "0.13"
# 오디오 소켓 IP_TOS(DSCP EF) 설정(P1-3). Cargo.lock에 이미 있는 버전이다.
socket2 = "0.6"
# 피어 쌍별 키 합의 (X25519 ECDH + HKDF-SHA256)
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"

# Utilities
parking_lot = "0.12"
tauri-plugin-process = "2"
# 진단 내보내기(P2-5): 저장 위치 대화상자, zip 작성, 로그 마스킹
tauri-plugin-dialog = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
regex = "1"
# 녹음 FLAC 저장(P2-4a): 순수 Rust 인코더(Apache-2.0). 기본 피처(par 스레드·serde·log)는 끔 — 쓰기 스레드에서 블록 단위로만 쓴다.
flacenc = { version = "0.5", default-features = false }

[target.'cfg(windows)'.dependencies]
# 워커/수신 스레드 MMCSS("Pro Audio") 등록, 엔진 실행 중 타이머 해상도 1ms(timeBeginPeriod)
# + 오디오 소켓 DSCP 마킹(qWAVE, P1-3)
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Media", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_NetworkManagement_QoS", "Win32_Networking_WinSock", "Win32_System_IO"] }
# 자체 WASAPI 백엔드(독점 이벤트 모드, IAudioClient3 저지연 공유 모드). 0.62는 Tauri가 이미 쓰는 버전이다.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
# FLAC 녹음 파일을 표준 디코더로 다시 읽어 비교(P2-4a)
claxon = "0.4"
# FLAC STREAMINFO MD5를 인코더와 따로 계산해 비교(PR #62 L2). flacenc가 이미 쓰는 크레이트다.
md-5 = "0.10"
# 릴레이 폴백 통합 테스트(tests/relay.rs): 실제 릴레이를 같은 프로세스에서 띄운다
band-relay = { path = "../../relay" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# 릴리스 빌드에서는 devtools 비활성. 필요 시: cargo tauri build --features devtools
devtools = ["tauri/devtools"]
# ASIO 지원 (CPAL_ASIO_DIR에 Steinberg ASIO SDK 필요). 기본 빌드는 WASAPI만.
asio = ["cpal/asio"]

# 디버그 빌드(dev:tauri)에서도 FLAC 녹음 인코딩이 실시간을 넉넉히 넘도록 인코더와 그 해시·CRC만 최적화한다(PR #62 M1).
# opt-level 0이면 30초 스테레오 24비트 인코딩이 실시간 4배뿐이라 9트랙(소스 8 + 믹스) 녹음이 링을 넘친다.
# 디버그 정보 설정(워크트리 공유 .cargo/config.toml의 profile.dev)과는 키가 겹치지 않는다.
[profile.dev.package.flacenc]
opt-level = 3

[profile.dev.package.md-5]
opt-level = 3

[profile.dev.package.crc]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
