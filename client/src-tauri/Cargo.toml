[package]
name = "band"
version = "0.1.0"
description = "Real-time music collaboration app"
authors = ["Band Team"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "band_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# Audio I/O (WASAPI 기본, ASIO는 `asio` 피처로 옵트인)
cpal = "0.15"
opus = "0.3"
ringbuf = "0.4"
rubato = "0.16"
# 지연 측정 상호상관(P1-1). rubato가 이미 쓰는 버전이다.
rustfft = "6"

# Network / crypto
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
if-addrs = "0.13"
# 피어 쌍별 키 합의 (X25519 ECDH + HKDF-SHA256)
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"

# Utilities
parking_lot = "0.12"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
# 워커/수신 스레드 MMCSS("Pro Audio") 등록
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }
# 자체 WASAPI 백엔드(독점 이벤트 모드, IAudioClient3 저지연 공유 모드). 0.62는 Tauri가 이미 쓰는 버전이다.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
# 릴레이 폴백 통합 테스트(tests/relay.rs): 실제 릴레이를 같은 프로세스에서 띄운다
band-relay = { path = "../../relay" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# 릴리스 빌드에서는 devtools 비활성. 필요 시: cargo tauri build --features devtools
devtools = ["tauri/devtools"]
# ASIO 지원 (CPAL_ASIO_DIR에 Steinberg ASIO SDK 필요). 기본 빌드는 WASAPI만.
asio = ["cpal/asio"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
