[package]
name = "band"
version = "0.1.0"
description = "Real-time music collaboration app"
authors = ["Band Team"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "band_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# Audio I/O (WASAPI 기본, ASIO는 `asio` 피처로 옵트인)
cpal = "0.15"
opus = "0.3"
ringbuf = "0.4"
rubato = "0.16"

# Network / crypto
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
if-addrs = "0.13"

# Utilities
parking_lot = "0.12"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# 릴리스 빌드에서는 devtools 비활성. 필요 시: cargo tauri build --features devtools
devtools = ["tauri/devtools"]
# ASIO 지원 (CPAL_ASIO_DIR에 Steinberg ASIO SDK 필요). 기본 빌드는 WASAPI만.
asio = ["cpal/asio"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
