[package]
name = "band"
version = "0.1.0"
description = "Real-time music collaboration app"
authors = ["Band Team"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "band_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio processing (WASAPI + ASIO)
cpal = { version = "0.15", features = ["asio"] }
opus = "0.3"
ringbuf = "0.3"  # Lock-free ring buffer for audio

# Async runtime
tokio = { version = "1", features = ["full"] }

# Networking
tokio-tungstenite = "0.21"

# Error handling
anyhow = "1"
thiserror = "1"

# Utilities
lazy_static = "1.4"
rand = "0.8"
crossbeam-channel = "0.5"  # Lock-free channels for audio threads

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
