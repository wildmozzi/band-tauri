app = 'band-server'
primary_region = 'nrt'  # Tokyo (서울 없으면 가장 가까운 리전)

[build]
  # 빌드 컨텍스트는 리포 루트다(P3-26, 루트 package-lock.json으로 의존 고정). 배포는 루트에서:
  #   flyctl deploy . --config server/fly.toml --dockerfile server/Dockerfile --remote-only
  # server/에서 그냥 `fly deploy`하면 컨텍스트에 lock이 없어 Dockerfile COPY에서 실패한다(의도된 실패).

[env]
  PORT = '8080'
  NODE_ENV = 'production'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false  # WebSocket 연결 유지를 위해 항상 실행
  auto_start_machines = true
  min_machines_running = 1

[[services]]
  protocol = 'tcp'
  internal_port = 8080

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 500

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
