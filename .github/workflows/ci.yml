name: CI

# 실행 위치: 이 리포 전용 self-hosted runner(개발 PC, Windows, 라벨 band-tauri).
# GitHub 호스티드 러너는 비공개 리포 무료 시간(월 2,000분, Windows 2배)을 다 써서 2026-11-10에 멈췄다(P3-0b).
# 러너 2대(jw-pc-band, jw-pc-band-2)가 잡을 나눠 돈다. 바뀐 경로에 해당하는 잡만 돌려 시간을 아낀다(push to overhaul/develop은 전부).

on:
  pull_request:
  push:
    branches: [develop, overhaul]

# 최소 권한: 체크아웃(contents), 변경 파일 목록(paths-filter → pull-requests), 아티팩트 업로드(actions).
permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Rust 빌드 산출물 위치(CARGO_TARGET_DIR)는 러너마다 다르게 각 러너 폴더의 .env에서 정한다
  # (C:actions-runner.env → .cargo-target/ci, C:actions-runner-2.env → .cargo-target/ci-2).
  # 러너 2대가 같은 폴더를 쓰면 cargo 잠금으로 서로 기다린다. 작업자 워크트리 공유 target과도 분리.
  CARGO_TERM_COLOR: always

# 모든 잡·스텝에 timeout-minutes를 둔다(P3-0). 값은 정상 소요의 약 2~3배.

jobs:
  changes:
    name: Changed paths
    runs-on: [self-hosted, band-tauri]
    timeout-minutes: 5
    outputs:
      engine: ${{ github.event_name == 'push' || steps.f.outputs.engine == 'true' }}
      relay: ${{ github.event_name == 'push' || steps.f.outputs.relay == 'true' }}
      client: ${{ github.event_name == 'push' || steps.f.outputs.client == 'true' }}
      server: ${{ github.event_name == 'push' || steps.f.outputs.server == 'true' }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: dorny/paths-filter@v3
        id: f
        timeout-minutes: 3
        with:
          filters: |
            engine:
              - 'client/src-tauri/**'
              - '.github/workflows/ci.yml'
            relay:
              - 'relay/**'
              - 'client/src-tauri/src/net/**'
              - '.github/workflows/ci.yml'
            client:
              - 'client/**'
              - '!client/src-tauri/**'
              - 'server/src/lib/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            server:
              - 'server/**'
              - 'docs/migrations/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  rust:
    # 결정적 테스트만 돈다: 단위 테스트(가상 시간 시뮬레이션 포함) + 벽시계 품질 임계가 없는 통합 테스트.
    # 실패하면 재시도 없이 실패 = 회귀로 본다.
    name: Rust engine (Windows)
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: [self-hosted, band-tauri]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: client/src-tauri
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - name: Toolchain PATH (rustup, CMake)
        timeout-minutes: 1
        run: |
          echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
          echo "$LOCALAPPDATA/Microsoft/WinGet/Packages/Kitware.CMake_Microsoft.Winget.Source_8wekyb3d8bbwe/cmake-4.4.4-windows-x86_64/bin" >> "$GITHUB_PATH"
      - name: Placeholder frontend dist (tauri::generate_context! 요구)
        timeout-minutes: 1
        run: mkdir -p ../dist && { [ -f ../dist/index.html ] || echo '<!doctype html>' > ../dist/index.html; }
      - name: Clippy
        timeout-minutes: 20
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (결정적)
        timeout-minutes: 20
        run: cargo test

  realtime:
    # 벽시계 의존 통합 테스트(tests/*.rs의 `#[ignore = "realtime: ..."]`)만 돈다. 단위 테스트의 ignore(known-bug 재현)는
    # `kind(test)` 필터로 제외한다. 각 테스트는 별도 프로세스에서 하나씩 돌고, 실패하면 최대 2번 더(총 3회) 재시도한다.
    # 판별: 같은 시나리오의 결정적 짝이 `rust` 잡에 있다. 짝이 녹색인데 여기만 실패하면 실행 환경, 짝도 실패하면 엔진 회귀다.
    # 주의: self-hosted(개발 PC)는 작업자 빌드와 CPU를 나눠 쓴다 — 실패 시 PC 부하도 확인할 것.
    name: Rust realtime (Windows, 3회 재시도)
    needs: [changes, rust]
    if: needs.changes.outputs.engine == 'true'
    runs-on: [self-hosted, band-tauri]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: client/src-tauri
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - name: Toolchain PATH (rustup, CMake)
        timeout-minutes: 1
        run: |
          echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
          echo "$LOCALAPPDATA/Microsoft/WinGet/Packages/Kitware.CMake_Microsoft.Winget.Source_8wekyb3d8bbwe/cmake-4.4.4-windows-x86_64/bin" >> "$GITHUB_PATH"
      # install-action은 pwsh(PowerShell 7)가 필요해 개발 PC에서 실패한다 — 없을 때만 1회 설치(self-hosted라 이후 유지).
      - name: Ensure cargo-nextest
        timeout-minutes: 15
        run: command -v cargo-nextest >/dev/null 2>&1 || cargo install cargo-nextest --locked
      - name: Placeholder frontend dist (tauri::generate_context! 요구)
        timeout-minutes: 1
        run: mkdir -p ../dist && { [ -f ../dist/index.html ] || echo '<!doctype html>' > ../dist/index.html; }
      - name: Build tests
        timeout-minutes: 20
        run: cargo nextest run --no-run
      - name: Realtime tests (직렬, 3회까지)
        timeout-minutes: 20
        run: cargo nextest run -E 'kind(test)' --run-ignored only --retries 2 --test-threads 1 --no-fail-fast --success-output final --failure-output immediate-final

  relay:
    name: Relay (clippy + test)
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: [self-hosted, band-tauri]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - name: Toolchain PATH (rustup)
        timeout-minutes: 1
        run: echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
      - name: Clippy
        timeout-minutes: 10
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        timeout-minutes: 10
        run: cargo test --locked -- --nocapture
      # Docker 빌드: 개발 PC에 Docker가 없으면 건너뛴다(릴리스 전 수동 확인 — BACKLOG P3-0b 메모).
      - name: Docker build (push 없음, Docker 있을 때만)
        timeout-minutes: 10
        run: |
          if command -v docker >/dev/null 2>&1; then docker build -t band-relay:ci .; else echo "docker 없음 — 건너뜀"; fi

  client:
    name: Client (build + test)
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: [self-hosted, band-tauri]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      # self-hosted: npm 캐시는 PC에 남아 있다. cache: npm(GitHub 캐시 서버 왕복)은 네트워크가 느리면 5분 시간 초과로 잡을 실패시켜 끈다.
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: 22
      - run: npm ci
        timeout-minutes: 8
      - run: npm run build
        timeout-minutes: 8
        working-directory: client
      - run: npm test
        timeout-minutes: 8
        working-directory: client
      - name: Lint
        timeout-minutes: 5
        run: npm run lint
        working-directory: client

  e2e:
    # 웹(비 Tauri) E2E: Playwright + chromium. Supabase(Auth/REST/Realtime)·서버 API·시그널링 WS·토스 SDK는
    # 전부 브라우저 안에서 가로챈다(client/e2e/mocks). 운영 DB에 접속하지 않고 비밀값도 쓰지 않는다.
    name: Web E2E (Playwright, chromium)
    needs: changes
    if: needs.changes.outputs.client == 'true' || needs.changes.outputs.server == 'true'
    runs-on: [self-hosted, band-tauri]
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      # self-hosted: npm 캐시는 PC에 남아 있다. cache: npm(GitHub 캐시 서버 왕복)은 네트워크가 느리면 5분 시간 초과로 잡을 실패시켜 끈다.
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: 22
      - run: npm ci
        timeout-minutes: 8
        working-directory: .
      # self-hosted: 브라우저는 %LOCALAPPDATA%\ms-playwright에 남아 있어 이미 있으면 바로 끝난다.
      - name: Install chromium
        timeout-minutes: 10
        run: npx playwright install chromium
      - name: Typecheck e2e
        timeout-minutes: 3
        run: npm run e2e:typecheck
      - name: E2E
        timeout-minutes: 10
        run: npm run e2e
      - name: Upload Playwright report + traces
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            client/e2e/.results/
            client/e2e/.report/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

  server:
    name: Server (build + test)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: [self-hosted, band-tauri]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      # self-hosted: npm 캐시는 PC에 남아 있다. cache: npm(GitHub 캐시 서버 왕복)은 네트워크가 느리면 5분 시간 초과로 잡을 실패시켜 끈다.
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: 22
      # ffmpeg(libopus 포함)는 개발 PC에 winget(Gyan.FFmpeg)으로 설치돼 있다. 찾아서 PATH에 올린다.
      - name: Put ffmpeg on PATH
        timeout-minutes: 2
        run: |
          d=$(ls -d "$LOCALAPPDATA"/Microsoft/WinGet/Packages/Gyan.FFmpeg*/ffmpeg-*/bin 2>/dev/null | sort -V | tail -1)
          if [ -z "$d" ]; then echo "ffmpeg 없음 — winget install Gyan.FFmpeg 필요"; exit 1; fi
          echo "$d" >> "$GITHUB_PATH"
      - name: Check ffmpeg
        timeout-minutes: 1
        run: ffmpeg -hide_banner -version | head -1 && ffmpeg -hide_banner -encoders | grep libopus
      - run: npm ci
        timeout-minutes: 8
      - run: npm run build
        timeout-minutes: 5
        working-directory: server
      - name: Typecheck scripts
        timeout-minutes: 5
        run: npx tsc -p scripts
        working-directory: server
      - run: npm test
        timeout-minutes: 10
        working-directory: server
        env:
          STEM_TEST_REQUIRE_FFMPEG: "1"
