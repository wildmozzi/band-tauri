name: CI

# 실행 위치: GitHub 호스티드 러너(P3-0c). 리포가 공개라 호스티드 러너는 무료·무제한이다.
# self-hosted runner는 쓰지 않는다 — 공개 리포에서는 외부 포크 PR이 러너 PC에서 임의 코드를 실행할 수 있다.
# Rust 엔진·realtime은 windows-latest(타깃 OS), 나머지는 ubuntu-latest(빠름).
# PR은 바뀐 경로에 해당하는 잡만 돈다. develop push·수동 실행(workflow_dispatch)은 전부 돈다.
# overhaul push는 돌지 않는다 — overhaul에는 PR CI를 통과한 것만 들어오고 문서 커밋이 잦다. 필요하면 수동 실행.
#
# 외부 포크 PR 안전: pull_request_target을 쓰지 않는다. 이 워크플로는 secrets를 하나도 참조하지 않는다
# (github.token은 포크 PR에서 읽기 전용으로 자동 강등된다). 비밀값이 필요한 스텝을 여기 넣지 말 것.

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      long_sim:
        description: '장시간 시뮬레이션(6피어 60분, long-sim 잡)도 돌린다'
        type: boolean
        default: false
      soak:
        description: '실시간 soak(6엔진 실제 시계·UDP, 프리셋 2개 × 60분, soak 잡)도 돌린다'
        type: boolean
        default: false
  # 야간(P1-6): 장시간 시뮬레이션(long-sim)과 실시간 soak(soak, P1-14)만 돈다(나머지 잡은 changes 잡이 건너뛰어 같이 빠진다). 03:30 KST.
  # GitHub schedule은 기본 브랜치(main)의 워크플로·코드로만 돈다 — main에 병합된 뒤부터 동작한다.
  # 실패·누락 알림은 `nightly` 라벨 이슈(nightly-report·nightly-watch 잡, docs/MEASURE.md 8절).
  schedule:
    - cron: '30 18 * * *'

# 최소 권한: 체크아웃(contents), 변경 파일 목록(paths-filter → pull-requests), 아티팩트 업로드(actions).
permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  # 장시간 수동 측정(long_sim·soak)은 따로 묶어, 그 사이 develop에 들어온 push가 측정을 취소하지 않게 한다.
  # 야간(schedule)도 따로 묶는다: 그러지 않으면 schedule의 ref가 refs/heads/main이라 main에서 수동 실행(workflow_dispatch)하면
  # 같은 그룹 ci-refs/heads/main이 되어 진행 중인 야간 실행이 취소된다.
  group: ci-${{ github.ref }}${{ github.event_name == 'schedule' && '-nightly' || github.event_name == 'workflow_dispatch' && (inputs.long_sim || inputs.soak) && '-long' || '' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # CI는 매번 새로 빌드한다: 증분 빌드 산출물은 rust-cache 크기만 키운다.
  CARGO_INCREMENTAL: 0
  # 디버그 정보는 줄 번호만(패닉 백트레이스용) — 링크 시간·캐시 크기를 줄인다.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

# 모든 잡·스텝에 timeout-minutes를 둔다(P3-0): 네트워크(apt, crates.io, npm)가 멈춰도 잡이 6시간 기본값까지
# 매달리지 않고 빨리 실패하게 한다. 값은 정상 소요의 약 2~3배.

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 야간 schedule에서는 건너뛴다 → 이 잡에 needs로 걸린 잡도 모두 건너뛴다(long-sim·soak만 돈다).
    if: github.event_name != 'schedule'
    # PR이 아니면(develop push, workflow_dispatch) 필터 없이 전부 돈다.
    outputs:
      engine: ${{ github.event_name != 'pull_request' || steps.f.outputs.engine == 'true' }}
      relay: ${{ github.event_name != 'pull_request' || steps.f.outputs.relay == 'true' }}
      loom: ${{ github.event_name != 'pull_request' || steps.f.outputs.loom == 'true' }}
      client: ${{ github.event_name != 'pull_request' || steps.f.outputs.client == 'true' }}
      server: ${{ github.event_name != 'pull_request' || steps.f.outputs.server == 'true' }}
    steps:
      # PR에서는 paths-filter가 API로 변경 파일 목록을 읽는다(체크아웃 불필요).
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: f
        timeout-minutes: 3
        with:
          # 각 필터의 패턴은 OR다(predicate-quantifier 기본값 some). 그래서 `!x/**` 같은 부정 패턴은 "x 밖의 모든 파일"과 맞아
          # 필터를 늘 참으로 만든다 — 제외가 필요하면 extglob `!(...)`로 한 경로 마디 안에서 뺀다(client 참고).
          # 경로 밖 파일을 읽는 의존(`include_str!`·`readFileSync`·path 의존)도 여기 적는다 — 빠지면 그 파일만 바꾼 PR에서 시험이 안 돈다.
          filters: |
            engine:
              - 'client/src-tauri/**'
              # band-engine의 개발 의존 `band-relay`(tests/relay.rs가 실제 릴레이를 같은 프로세스에서 띄운다)
              - 'relay/src/**'
              - 'relay/Cargo.toml'
              # 토큰 공용 벡터: band-engine net/relay.rs 시험이 include_str!로 읽는다(relay·server 시험도 같은 파일)
              - 'docs/overhaul/relay-token-vectors.json'
              - '.github/workflows/ci.yml'
            relay:
              - 'relay/**'
              - 'client/src-tauri/crates/band-engine/src/net/**'
              # 릴레이 계약 파일만: 접두부·예산 상수(types)와 패킷 헤더(packet). ⑩-1에서 net/에서 band-dsp로 옮겼다.
              # 같이 옮긴 media_link·clock은 relay/가 쓰지 않아 넣지 않는다(#160 리뷰 L4).
              - 'client/src-tauri/crates/band-dsp/src/types.rs'
              - 'client/src-tauri/crates/band-dsp/src/packet.rs'
              # relay/src/{relay,token}.rs 시험이 include_str!로 읽는다
              - 'docs/overhaul/relay-token-vectors.json'
              - '.github/workflows/ci.yml'
            loom:
              # SeqCell 메모리 순서 모델 검사(loom 잡). 시험·대상은 stats.rs, loom 의존·cfg 선언은 Cargo.toml, 버전은 Cargo.lock.
              # lib.rs는 모듈 선언·크레이트 cfg — `--cfg loom` 빌드가 크레이트 전체를 컴파일하므로 같이 본다.
              - 'client/src-tauri/crates/band-dsp/src/stats.rs'
              - 'client/src-tauri/crates/band-dsp/src/lib.rs'
              - 'client/src-tauri/crates/band-dsp/Cargo.toml'
              - 'client/src-tauri/Cargo.lock'
              - '.github/workflows/ci.yml'
            client:
              # client/ 아래에서 src-tauri만 뺀다: 루트 파일(client/*)과 src-tauri가 아닌 디렉터리 전부.
              # 예전 `'!client/src-tauri/**'`는 OR라 docs만 바꾼 PR에서도 참이었다(#170 리뷰 후속).
              - 'client/*'
              - 'client/!(src-tauri)/**'
              # src/app/tauriCsp.test.ts가 읽는다
              - 'client/src-tauri/tauri.conf.json'
              # 루트 scripts/*.test.mjs(버전 올리기·CPU 비교 통계, P1-21b)는 client 잡에서 돈다. cpu-compare 시험이 원자료 CSV를 읽는다.
              - 'scripts/**'
              - 'docs/overhaul/cpu-quiet-2026-11-17-runs.csv'
              - 'server/src/lib/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            server:
              - 'server/**'
              - 'docs/migrations/**'
              # test/relay-token.test.ts가 읽는다
              - 'docs/overhaul/relay-token-vectors.json'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  rust:
    # 결정적 테스트만 돈다: 단위 테스트(가상 시간 시뮬레이션 포함) + 벽시계 품질 임계가 없는 통합 테스트.
    # 실패하면 재시도 없이 실패 = 회귀로 본다.
    # 워크스페이스(엔진 R-1 ⑩-1·⑩-2): `client/src-tauri/Cargo.toml`의 `default-members`가 앱(`band`)·`crates/band-engine`·
    # `crates/band-dsp`를 함께 고르므로 아래 명령(clippy 구성들, 릴리스 예제 check, test)과 realtime 잡의 nextest는 `--workspace`
    # 없이 세 크레이트를 모두 본다. 통합 테스트·예제·하네스는 전부 `band-engine`에 있다(앱에는 시험이 없다). 하네스는 `band-engine`의
    # 테스트 타깃 `sim`(`crates/band-engine/tests/sim`, ⑩-3)이라 아래 `cargo test`가 함께 돈다(5분 하네스·fixture 비교 포함).
    name: Rust engine (Windows)
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: client/src-tauri
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
        with:
          workspaces: client/src-tauri
      - name: Placeholder frontend dist (tauri::generate_context! 요구)
        timeout-minutes: 1
        run: mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html
      - name: Clippy
        timeout-minutes: 20
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (제품 구성, test-support 없음)
        # 위 `--all-targets`는 자기 자신 개발 의존(Cargo.toml)이 `test-support`를 늘 켠 구성이다(엔진 R-1 ⑨a) — soak.rs·cpu_profile.rs 등
        # 테스트 전용 경로도 거기서 검사된다. 여기서는 반대로 테스트 타깃 없이(피처가 합쳐지지 않는다) 제품 구성만 본다:
        # `test-support` 뒤의 내부(`band_engine::testing` 등)를 제품 코드가 실수로 쓰면 여기서만 실패한다.
        timeout-minutes: 20
        run: cargo clippy --lib --bins -- -D warnings
      - name: Clippy (band-engine, 백엔드 없음)
        # 하네스·시험은 band-engine을 장치 백엔드(cpal·windows) 없이 쓸 수 있어야 한다(엔진 R-1 ⑩-2, engine-stage5-10-scope.md 7.4절).
        # `backend-cpal`·`backend-wasapi` 게이트가 빠지거나 백엔드 밖 코드가 cpal·windows를 쓰면 여기서만 실패한다. 예제는
        # `required-features`로 빠진다. (`tests/architecture.rs`의 `engine_crate_deps_follow_graph`가 같은 규칙을 정적으로도 본다.)
        timeout-minutes: 20
        run: cargo clippy -p band-engine --no-default-features --features test-support --all-targets -- -D warnings
      - name: Clippy (band-engine, cpal 백엔드만)
        # `backend-cpal`만 켠 제품 구성 = Windows 밖의 기본 구성(자체 WASAPI는 `cfg(windows)`). 백엔드 피처 조합이 계약(7.4절)이므로
        # 기본(둘 다)·없음과 함께 이 조합도 본다 — `backend-wasapi` 게이트 안에서만 쓰는 import가 밖에 남으면 여기서만 실패한다(#161 리뷰 L-1).
        timeout-minutes: 20
        run: cargo clippy -p band-engine --no-default-features --features backend-cpal -- -D warnings
      - name: Check (band-engine, 자체 WASAPI 백엔드만)
        # `backend-wasapi`만 켠 구성도 피처 조합 계약(7.4절)이다. 장치 선택(`select`, cpal 폴백)이 없어 wasapi 쪽이 쓰이지 않으므로
        # 미사용 경고는 피할 수 없다 — clippy `-D warnings`가 아니라 컴파일만 본다(`backend-wasapi` 안에서 쓰는 항목이 다른 피처
        # 게이트 뒤로 들어가면 E0432로 실패한다, #169 리뷰 M1).
        timeout-minutes: 20
        run: cargo check -p band-engine --no-default-features --features backend-wasapi
      - name: Check (릴리스 예제)
        # 예제는 개발 의존으로 `test-support`가 켜진 채 디버그·릴리스 모두 빌드돼야 한다(⑨a-2). 위 `--all-targets`는 디버그만 본다 —
        # `debug_assertions`에 기대는 cfg가 다시 생기면 여기서 실패한다(#158 리뷰 L3).
        timeout-minutes: 20
        run: cargo check --release --examples
      - name: Test (결정적)
        timeout-minutes: 20
        run: cargo test
        env:
          # 장시간 시뮬레이션 짧은 버전(6피어 5분, P1-6)의 리포트 위치
          SIM_REPORT_DIR: ${{ runner.temp }}/sim-report
      - name: Upload sim report (실패 시)
        if: failure()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: sim-report-short-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sim-report/
          retention-days: 14
          if-no-files-found: ignore

  rust-linux:
    # 비Windows 엔진 구성(⑨b-1·⑨b-2 리뷰): `band-engine`의 `cfg(not(windows))` 경로와 Windows 밖 기본 장치 구성(cpal만 — 자체 WASAPI는
    # `cfg(windows)`)이 컴파일되는지 본다. 앱(`band`, tauri — WebKitGTK 등 시스템 의존과 프런트 dist가 필요)은 빌드하지 않는다:
    # 모든 명령에 `-p`를 붙여 `default-members`의 앱을 빼고, dist 자리 표시도 두지 않는다(앱을 빌드하면 여기서 실패한다).
    # 타깃 OS는 Windows이므로 실시간(`#[ignore = "realtime"]`)·장시간 시험은 돌리지 않는다 — 결정적 시험만.
    # 경로 필터는 Windows `rust` 잡과 같은 `engine`이다.
    name: Rust engine (Linux, 비Windows 구성)
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: client/src-tauri
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - name: System deps (ALSA — cpal 리눅스 백엔드)
        # cpal의 리눅스 기본 호스트(ALSA)가 `alsa-sys`로 libasound를 pkg-config로 찾는다. opus(audiopus_sys)는 러너에 있는 CMake로 빌드한다.
        timeout-minutes: 5
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
        with:
          workspaces: client/src-tauri
          key: linux
      - name: Test (band-dsp)
        timeout-minutes: 15
        run: cargo test -p band-dsp
      - name: Clippy (band-engine, 기본 피처)
        # 리눅스에서 기본 피처 = cpal + `backend-wasapi`(켜도 `cfg(windows)` 밖이라 아무것도 더하지 않는다, band-engine Cargo.toml 주석).
        # `feature = "backend-wasapi"`만 보고 `windows`를 쓰는 코드가 생기면 여기서만 실패한다.
        timeout-minutes: 20
        run: cargo clippy -p band-engine --all-targets -- -D warnings
      - name: Clippy (band-engine, cpal 백엔드만)
        timeout-minutes: 20
        run: cargo clippy -p band-engine --no-default-features --features backend-cpal,test-support --all-targets -- -D warnings
      - name: Clippy (band-engine, 백엔드 없음)
        timeout-minutes: 20
        run: cargo clippy -p band-engine --no-default-features --features test-support --all-targets -- -D warnings
      - name: Test (band-engine, 백엔드 없음, 결정적)
        # 가짜 장치·하네스(`sim`)·릴레이 폴백 등 결정적 시험. 실시간 시험은 ignore라 돌지 않는다.
        timeout-minutes: 25
        run: cargo test -p band-engine --no-default-features --features test-support
        env:
          SIM_REPORT_DIR: ${{ runner.temp }}/sim-report

  loom:
    # SeqCell(band-dsp stats.rs) seqlock의 메모리 순서를 loom으로 모든 인터리빙에 걸쳐 검사한다(#173, #141 리뷰 L-2).
    # 모델 검사는 OS 무관이라 ubuntu에서 돈다(Windows 러너를 쓰지 않는다). 결정적이다 — 같은 코드면 결과가 같으므로
    # 야간 반복은 두지 않고, 필터(loom)에 걸린 PR과 develop push·수동 실행에서만 돈다.
    # RUSTFLAGS(`--cfg loom`)가 달라 다른 잡의 산출물을 쓸 수 없다: 캐시 키를 따로 둔다(rust-cache는 RUSTFLAGS도 키에 넣는다).
    name: Loom (SeqCell 메모리 순서)
    needs: changes
    if: needs.changes.outputs.loom == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: client/src-tauri
    env:
      RUSTFLAGS: --cfg loom
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
        with:
          workspaces: client/src-tauri
          key: loom
      - name: Clippy (band-dsp, --cfg loom)
        # loom 시험 모듈과 `seq_hint`·`seq_fence` 별칭의 loom 쪽 cfg는 이 구성에서만 컴파일된다.
        timeout-minutes: 10
        run: cargo clippy -p band-dsp --release --lib --tests -- -D warnings
      - name: Loom 모델 검사
        # 제품 시험(찢긴 읽기 없음)과 변이 시험(`loom_mutant_*`: 순서를 하나씩 약하게 한 복사본을 loom이 잡는지).
        timeout-minutes: 10
        run: cargo test -p band-dsp --release --lib loom

  long-sim:
    # 장시간 시뮬레이션(P1-6): 6피어 풀메시 60분 가상 시간(결정적, 디버그 빌드 로컬 약 8분 — 러너는 더 느릴 수 있다). GOAL 1·2절 수치를 자동 판정해
    # Markdown·JSON 리포트를 남긴다. 야간 schedule과 수동 실행(long_sim 입력)에서만 돈다.
    # 리포트는 성공해도 올린다(추세 비교용). 실패 = GOAL 미달 또는 알려진 미달의 악화.
    name: Long sim (6피어 60분, Windows)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.long_sim)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: client/src-tauri
    # SIM_REPORT_DIR는 step 단위로 둔다. job-level env에서는 runner 컨텍스트를 쓸 수 없다(쓰면 워크플로 전체가 무효).
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          # schedule은 기본 브랜치(main)의 워크플로로 돈다. 야간에는 개발 흐름(develop) 코드를 잰다.
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
        with:
          workspaces: client/src-tauri
      - name: Build tests
        timeout-minutes: 20
        # 하네스는 band-engine의 테스트 타깃 `sim`이다(⑩-3, engine-stage5-10-scope.md 7.4절 "나"). 장치 백엔드(cpal·windows)와
        # 앱(tauri — `tauri-build`가 프런트 dist를 요구)을 빌드하지 않으므로 dist 자리 표시가 필요 없다. `--no-default-features`를
        # 빼면 백엔드가 켜진 채로 빌드된다(결과는 같고 더 컴파일할 뿐).
        run: cargo test -p band-engine --no-default-features --features test-support --test sim --no-run
      - name: Long sim (60분)
        timeout-minutes: 50
        run: cargo test -p band-engine --no-default-features --features test-support --test sim long_sim_6peers_60min -- --ignored --nocapture
        env:
          SIM_REPORT_DIR: ${{ runner.temp }}/sim-report
      - name: Job summary
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        run: cat "$SIM_REPORT_DIR/sim-report-long-60min.md" >> "$GITHUB_STEP_SUMMARY" || true
        env:
          SIM_REPORT_DIR: ${{ runner.temp }}/sim-report
      - name: Upload sim report
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: sim-report-long-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sim-report/
          retention-days: 30
          if-no-files-found: warn

  soak:
    # 실시간 soak(P1-14, GOAL 2-3·2-4): 가짜 장치 엔진 6개를 127.0.0.1 UDP 풀메시로 실제 시계에서 60분씩 돌린다(tests/soak.rs).
    # 프리셋 2개(기본·초저지연)를 차례로. long-sim과 같은 조건(야간 schedule, 수동 실행 soak 입력)에서만 돈다.
    # 측정 도구: 수치 판정 없이 Markdown·JSON 리포트를 아티팩트로 남긴다(성공해도). 실패 = Connected 이탈·엔진 정지·패닉.
    # tests/soak.rs는 realtime 잡(ignore 전부 실행)의 nextest 필터에서 `!binary(soak)`로 뺀다(⑨a부터 테스트 빌드는 늘 test-support).
    name: Soak (6엔진 실시간 60분 × 2, Windows)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.soak)
    runs-on: windows-latest
    timeout-minutes: 170
    defaults:
      run:
        shell: bash
        working-directory: client/src-tauri
    # SOAK_OUT은 step 단위로 둔다(job-level env에서는 runner 컨텍스트를 쓸 수 없다).
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          # schedule은 기본 브랜치(main)의 워크플로로 돈다. 야간에는 개발 흐름(develop) 코드를 잰다.
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
        with:
          workspaces: client/src-tauri
          key: soak
      - name: Build tests (release, 백엔드 없음)
        timeout-minutes: 30
        # soak 시험은 band-engine에 있고 가짜 장치만 쓴다(⑩-2). 장치 백엔드(cpal·windows)와 앱(tauri-build — 프런트 dist 필요)을
        # 빌드하지 않는다(⑩-3, 하네스와 같은 구성). `test-support`는 개발 의존이 어차피 켜지만 명령에 드러낸다.
        run: cargo test -p band-engine --no-default-features --features test-support --release --test soak --no-run
      - name: Soak 기본(균형) 60분
        timeout-minutes: 65
        run: cargo test -p band-engine --no-default-features --features test-support --release --test soak soak_balanced -- --ignored --exact --nocapture
        env:
          SOAK_OUT: ${{ runner.temp }}/soak-report
      - name: Soak 초저지연 60분
        # 앞 프리셋이 실패해도 돈다(리포트를 둘 다 남긴다)
        if: ${{ !cancelled() }}
        timeout-minutes: 65
        run: cargo test -p band-engine --no-default-features --features test-support --release --test soak soak_ultra_low -- --ignored --exact --nocapture
        env:
          SOAK_OUT: ${{ runner.temp }}/soak-report
      - name: Job summary
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        run: cat "$SOAK_OUT"/soak-*.md >> "$GITHUB_STEP_SUMMARY" || true
        env:
          SOAK_OUT: ${{ runner.temp }}/soak-report
      - name: Upload soak report
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: soak-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/soak-report/
          retention-days: 30
          if-no-files-found: warn

  nightly-report:
    # 야간 알림(GOAL-COVERAGE ①): schedule 실행에서 long-sim·soak 중 하나라도 success가 아니면(실패·취소·시간 초과) `nightly` 라벨
    # 이슈를 연다(같은 제목이 열려 있으면 댓글만). 둘 다 성공하면 열린 nightly 이슈에 "복구됨" 댓글을 달고 닫는다. 판단·API 호출은
    # scripts/nightly-issue.mjs(시험: scripts/nightly-issue.test.mjs). 비밀값 없이 github.token만, 쓰기 권한은 이 잡의 issues뿐.
    # 체크아웃은 기본 ref(schedule이면 main) — 이 스크립트도 워크플로와 같은 main 것을 쓴다. 수치 요약은 long-sim·soak 잡의 Job summary.
    name: Nightly report (이슈 알림)
    needs: [long-sim, soak]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          sparse-checkout: scripts
      - name: 결과를 이슈로
        timeout-minutes: 2
        run: |
          {
            echo '### 야간 장시간 잡 결과'
            echo '| 잡 | 결과 |'
            echo '|---|---|'
            echo "| long-sim | ${{ needs.long-sim.result }} |"
            echo "| soak | ${{ needs.soak.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          node scripts/nightly-issue.mjs report --long-sim '${{ needs.long-sim.result }}' --soak '${{ needs.soak.result }}'
        env:
          GITHUB_TOKEN: ${{ github.token }}

  nightly-watch:
    # 야간이 "돌지 않는" 경우 알림: schedule이 아예 안 뜨면(main에서 빠짐, 워크플로 비활성 — 공개 리포는 60일 무활동이면 자동 비활성)
    # 야간 실행 안의 잡으로는 알 수 없으므로 develop push(자주 일어남)마다 마지막 schedule 실행 시각을 본다. 36시간을 넘으면
    # "돌지 않음" 이슈를 연다(이미 열려 있으면 아무것도 안 한다). schedule 기록이 아직 하나도 없으면 이슈 없이 로그만 — main 반영 직후 오경보 방지.
    # 호스팅 러너 10초 남짓. push(develop)에서만 돌아 외부 포크 PR에는 쓰기 토큰이 가지 않는다.
    name: Nightly watch (야간 실행 누락 감시)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          sparse-checkout: scripts
      - name: 마지막 schedule 실행 확인
        timeout-minutes: 2
        run: node scripts/nightly-issue.mjs stale --max-age-hours 36
        env:
          GITHUB_TOKEN: ${{ github.token }}

  realtime:
    # 벽시계 의존 통합 테스트(tests/*.rs의 `#[ignore = "realtime: ..."]`)와 lib 안 실시간 시험(이름이 `realtime_`으로
    # 시작하는 `#[ignore = "realtime: ..."]`, 예: sys::cpu, P3-15)만 돈다. 그 밖의 단위 테스트 ignore(known-bug 재현·측정·long)는
    # `kind(test) | (kind(lib) & test(/::realtime_/))` 필터로 제외한다. 하네스(테스트 타깃 `sim`, ⑩-3 — 전에는 lib 안이라 필터 밖이었다)의
    # ignore(60분 long·측정 스윕)는 결정적·장시간이라 `!binary(sim)`으로 뺀다(60분은 long-sim 잡). 워커 기상 지연
    # 측정 도구(`tests/wake_latency.rs`, P2-17c)는 판정 없이 표만 내는 40초짜리라 `!binary(wake_latency)`로 뺀다(P2-17f). 가짜 장치를 실제 스레드·실제 시계로 돌려 은닉·끊김·지연 임계를 재므로
    # 러너 스케줄링에 흔들린다. 각 테스트는 별도 프로세스에서 하나씩 돌고, 실패하면 최대 2번 더(총 3회) 재시도한다.
    # 3회 모두 실패하면 잡이 실패한다. 재시도 끝에 통과한 테스트는 nextest 요약에 FLAKY로 남는다.
    # 판별: 같은 시나리오의 결정적 짝이 `rust` 잡에 있다. 짝이 녹색인데 여기만 실패하면 실행 환경, 짝도 실패하면 엔진 회귀다.
    name: Rust realtime (Windows, 3회 재시도)
    needs: [changes, rust]
    if: needs.changes.outputs.engine == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: client/src-tauri
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
        with:
          workspaces: client/src-tauri
          key: realtime
      - uses: taiki-e/install-action@v2
        timeout-minutes: 5
        with:
          tool: cargo-nextest
      - name: Placeholder frontend dist (tauri::generate_context! 요구)
        timeout-minutes: 1
        run: mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html
      - name: Build tests
        timeout-minutes: 20
        # default-members(앱·band-engine·band-dsp) 전체. 통합 시험(kind(test))과 lib의 `realtime_` 시험은 전부 band-engine에 있다(⑩-2) —
        # 앱 lib 시험 바이너리(시험 0개)도 함께 빌드되므로 위 dist 자리 표시가 남는다.
        run: cargo nextest run --no-run
      - name: Realtime tests (직렬, 3회까지)
        # 42개 직렬(2026-11-18 nextest list, wake_latency 제외 뒤 — 37개일 때 약 22분, 2026-11-13) + 재시도 여유. 넘으면 시험 구성 재검토
        timeout-minutes: 35
        run: cargo nextest run -E '(kind(test) & !binary(soak) & !binary(sim) & !binary(wake_latency)) | (kind(lib) & test(/::realtime_/))' --run-ignored only --retries 2 --test-threads 1 --no-fail-fast --success-output final --failure-output immediate-final

  relay:
    name: Relay (clippy + test)
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
        with:
          workspaces: relay
      - name: Clippy
        timeout-minutes: 10
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        timeout-minutes: 10
        run: cargo test --locked -- --nocapture
      - name: Docker build (push 없음)
        timeout-minutes: 10
        run: docker build -t band-relay:ci .

  client:
    name: Client (build + test)
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        timeout-minutes: 8
      - run: npm run build
        timeout-minutes: 8
        working-directory: client
      - run: npm test
        timeout-minutes: 8
        working-directory: client
      - name: Lint
        timeout-minutes: 5
        run: npm run lint
        working-directory: client
      - name: Repo scripts tests (scripts/*.test.mjs)
        timeout-minutes: 3
        run: node --test scripts/*.test.mjs

  e2e:
    # 웹(비 Tauri) E2E: Playwright + chromium. Supabase(Auth/REST/Realtime)·서버 API·시그널링 WS·토스 SDK는
    # 전부 브라우저 안에서 가로챈다(client/e2e/mocks). 운영 DB에 접속하지 않고 비밀값도 쓰지 않는다.
    # 가짜 엔드포인트로 따로 빌드한 앱(client/e2e/vite.config.ts)을 vite preview로 띄운다. 실패 시 trace·스크린샷을 올린다.
    # 시각 회귀는 ubuntu에서 *-linux.png 스냅샷과 비교한다(client/e2e/__screenshots__, 경로 규칙은 playwright.config.ts).
    name: Web E2E (Playwright, chromium)
    needs: changes
    if: needs.changes.outputs.client == 'true' || needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        timeout-minutes: 8
        working-directory: .
      - name: Playwright version
        id: pw
        timeout-minutes: 1
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          # 러너 이미지 OS(ubuntu24 등). OS 의존 패키지 캐시 키에 쓴다
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
          echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"
      - name: Restore Playwright browsers
        id: pw-cache
        timeout-minutes: 3
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # 브라우저 바이너리는 Playwright CDN에서 받는다(apt 무관). OS 의존 패키지는 아래에서 따로 설치한다.
      - name: Install chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx playwright install chromium
      # OS 의존 패키지(P3-0e): 우분투 apt 미러 장애(azure.archive.ubuntu.com DNS 실패)로 install-deps가 멈추면 E2E가
      # 전부 막혔다. 실패를 허용하면(#73) 한국어 폰트(fonts-wqy-zenhei — install-deps가 까는 유일한 한글 글꼴)가 빠져
      # 시각 회귀가 두부 글자로 실패한다. 그래서 install-deps가 실제로 받은 .deb를 캐시해 두고 dpkg로 오프라인 설치한다.
      # - 같은 패키지·같은 버전이 깔리므로 렌더링이 apt 경로와 같다 → linux 기준 이미지를 바꿀 필요가 없다.
      # - 캐시 미적중(Playwright 버전·러너 OS가 바뀜) 또는 오프라인 설치 실패면 apt 경로(install-deps, 재시도·시간 제한).
      # - 캐시 범위: PR은 자기 PR·base 브랜치(overhaul)·기본 브랜치(main) 캐시를 읽는다. overhaul에서 수동 실행하면 채워진다.
      - name: Restore OS deps (.deb 캐시)
        id: deps-cache
        timeout-minutes: 3
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pw-osdeps
          key: pw-osdeps-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}-v1
      - name: Install OS deps (캐시, 오프라인)
        id: deps-offline
        if: steps.deps-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -euo pipefail
          shopt -s nullglob
          # 이미 깔린 패키지는 건드리지 않는다(이미지가 더 새 버전을 갖고 있으면 내리지 않게)
          todo=()
          for deb in "$HOME"/.cache/pw-osdeps/*.deb; do
            pkg=$(dpkg-deb -f "$deb" Package)
            if dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null | grep -qx 'install ok installed'; then
              echo "이미 설치됨: $pkg"
            else
              todo+=("$deb")
            fi
          done
          echo "캐시에서 설치: ${#todo[@]}개"
          if (( ${#todo[@]} )); then sudo dpkg -i "${todo[@]}"; fi
      - name: Install OS deps (apt)
        id: deps-apt
        if: steps.deps-cache.outputs.cache-hit != 'true' || steps.deps-offline.outcome == 'failure'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # install-deps가 부르는 apt-get에 재시도·시간 제한을 주고, 받은 .deb를 지우지 않게 한다(아래에서 캐시)
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            'DPkg::Lock::Timeout "60";' 'APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/99pw-osdeps >/dev/null
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          # 호스티드 이미지는 미러 목록(mirror+file)의 첫 순위가 azure 미러다. 그 DNS가 죽으면 이 경로(=캐시 시드)도 막히므로
          # 공식 아카이브·kernel.org 미러를 앞에 두고 azure는 마지막으로. 순서가 고정이라 결정적이다(noble 패키지 버전은 미러 간 같다).
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo "기존 미러 목록:" && cat /etc/apt/apt-mirrors.txt
            printf '%s\tpriority:%s\n' http://archive.ubuntu.com/ubuntu/ 1 http://mirrors.edge.kernel.org/ubuntu/ 2 \
              http://azure.archive.ubuntu.com/ubuntu/ 3 | sudo tee /etc/apt/apt-mirrors.txt
          fi
          sudo rm -f /var/cache/apt/archives/*.deb
          npx playwright install-deps chromium
          dir="$HOME/.cache/pw-osdeps"
          rm -rf "$dir" && mkdir -p "$dir"
          cp /var/cache/apt/archives/*.deb "$dir"/ 2>/dev/null || true
          n=$(find "$dir" -name '*.deb' | wc -l)
          echo "캐시할 .deb: $n개" && ls "$dir"
          echo "debs=$n" >> "$GITHUB_OUTPUT"
      - name: Save OS deps (.deb 캐시)
        if: steps.deps-cache.outputs.cache-hit != 'true' && steps.deps-apt.outcome == 'success' && steps.deps-apt.outputs.debs != '0'
        timeout-minutes: 3
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pw-osdeps
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}
      # 어느 경로든 한글 글꼴이 없으면 여기서 바로 실패한다(시각 회귀가 두부 글자로 실패하는 것보다 원인이 분명하다).
      # linux 기준 이미지는 이 글꼴(WenQuanYi Zen Hei)로 렌더링됐다.
      - name: Check Korean font
        timeout-minutes: 1
        run: |
          f=/usr/share/fonts/truetype/wqy/wqy-zenhei.ttc
          if [ ! -f "$f" ]; then echo "::error::한글 글꼴 없음: $f (fonts-wqy-zenhei)"; exit 1; fi
          dpkg-query -W fonts-wqy-zenhei
          if command -v fc-match >/dev/null; then fc-match 'sans-serif:lang=ko'; fi
      - name: Typecheck e2e
        timeout-minutes: 3
        run: npm run e2e:typecheck
      - name: E2E
        timeout-minutes: 10
        run: npm run e2e
      # 성공해도 올린다: CI는 retries 1이라 첫 시도 실패 → 재시도 통과(flaky)면 잡이 녹색이다.
      # trace는 실패한 시도만 남으므로(retain-on-failure) flaky 증거가 이 아티팩트에 남는다.
      # 시각 회귀가 실패하면 실제 스크린샷(*-actual.png)도 여기 남는다 — linux 스냅샷 갱신에 쓴다.
      - name: Upload Playwright report + traces
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            client/e2e/.results/
            client/e2e/.report/
          retention-days: 7
          if-no-files-found: ignore
          # 결과 디렉터리 이름이 '.'으로 시작한다(.results/.report) — v4.4부터 숨김 파일은 기본 제외
          include-hidden-files: true

  server:
    name: Server (build + test)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FFMPEG_DIR: ${{ github.workspace }}/.ffmpeg
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: 22
          cache: npm
      # ffmpeg 설치(stem Opus 인코딩 테스트). apt-get이 50분 멈춘 사례가 있어 순서를 바꿨다:
      # 1) 캐시된 정적 바이너리 → 2) 정적 바이너리 다운로드(재시도·시간 제한) → 3) apt(재시도·시간 제한).
      - name: Restore ffmpeg cache
        id: ffmpeg-cache
        timeout-minutes: 3
        uses: actions/cache@v4
        with:
          path: .ffmpeg
          # BtbN 정적 빌드(GPL, libopus 포함). 릴리스 브랜치(n7.1 → n8.1 …)가 돌아가며 사라지므로 파일 이름을
          # 고정하지 않고, 캐시가 없을 때만 latest 릴리스에서 가장 오래된 유지 브랜치를 고른다. 키를 바꾸면 새로 받는다.
          key: ffmpeg-btbn-linux64-gpl-v2
      - name: Download static ffmpeg
        id: ffmpeg-static
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 4
        env:
          # 공개 릴리스 조회용 자동 토큰(리포 secret 아님, 포크 PR에서는 읽기 전용).
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$FFMPEG_DIR"
          asset=$(gh release view latest -R BtbN/FFmpeg-Builds --json assets -q '.assets[].name' \
            | grep -E '^ffmpeg-n[0-9.]+-latest-linux64-gpl-[0-9.]+\.tar\.xz$' | sort -V | head -1)
          echo "asset: $asset"
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 -o /tmp/ffmpeg.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$asset"
          tar -xJf /tmp/ffmpeg.tar.xz -C "$FFMPEG_DIR" --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          "$FFMPEG_DIR/ffmpeg" -hide_banner -encoders | grep -q libopus
      - name: Install ffmpeg via apt (fallback)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true' && steps.ffmpeg-static.outcome != 'success'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          rm -rf "$FFMPEG_DIR"
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60"
          timeout 180 sudo apt-get $APT update
          timeout 300 sudo apt-get $APT install -y --no-install-recommends ffmpeg
      - name: Put ffmpeg on PATH
        timeout-minutes: 1
        run: |
          if [ -x "$FFMPEG_DIR/ffmpeg" ]; then echo "$FFMPEG_DIR" >> "$GITHUB_PATH"; fi
      - name: Check ffmpeg
        timeout-minutes: 1
        run: ffmpeg -hide_banner -version | head -1 && ffmpeg -hide_banner -encoders | grep libopus
      - run: npm ci
        timeout-minutes: 8
      - run: npm run build
        timeout-minutes: 5
        working-directory: server
      - name: Typecheck scripts
        timeout-minutes: 5
        run: npx tsc -p scripts
        working-directory: server
      - run: npm test
        timeout-minutes: 10
        working-directory: server
        env:
          STEM_TEST_REQUIRE_FFMPEG: "1"
