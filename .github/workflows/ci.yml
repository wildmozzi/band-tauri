name: CI

# 실행 위치: GitHub 호스티드 러너(P3-0c). 리포가 공개라 호스티드 러너는 무료·무제한이다.
# self-hosted runner는 쓰지 않는다 — 공개 리포에서는 외부 포크 PR이 러너 PC에서 임의 코드를 실행할 수 있다.
# Rust 엔진·realtime은 windows-latest(타깃 OS), 나머지는 ubuntu-latest(빠름).
# PR은 바뀐 경로에 해당하는 잡만 돈다. develop push·수동 실행(workflow_dispatch)은 전부 돈다.
# overhaul push는 돌지 않는다 — overhaul에는 PR CI를 통과한 것만 들어오고 문서 커밋이 잦다. 필요하면 수동 실행.
#
# 외부 포크 PR 안전: pull_request_target을 쓰지 않는다. 이 워크플로는 secrets를 하나도 참조하지 않는다
# (github.token은 포크 PR에서 읽기 전용으로 자동 강등된다). 비밀값이 필요한 스텝을 여기 넣지 말 것.

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      long_sim:
        description: '장시간 시뮬레이션(6피어 60분, long-sim 잡)도 돌린다'
        type: boolean
        default: false
  # 야간(P1-6): 장시간 시뮬레이션만 돈다(나머지 잡은 changes 잡이 건너뛰어 같이 빠진다). 03:30 KST.
  # GitHub schedule은 기본 브랜치(main)의 워크플로·코드로만 돈다 — main에 병합된 뒤부터 동작한다.
  schedule:
    - cron: '30 18 * * *'

# 최소 권한: 체크아웃(contents), 변경 파일 목록(paths-filter → pull-requests), 아티팩트 업로드(actions).
permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # CI는 매번 새로 빌드한다: 증분 빌드 산출물은 rust-cache 크기만 키운다.
  CARGO_INCREMENTAL: 0
  # 디버그 정보는 줄 번호만(패닉 백트레이스용) — 링크 시간·캐시 크기를 줄인다.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

# 모든 잡·스텝에 timeout-minutes를 둔다(P3-0): 네트워크(apt, crates.io, npm)가 멈춰도 잡이 6시간 기본값까지
# 매달리지 않고 빨리 실패하게 한다. 값은 정상 소요의 약 2~3배.

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 야간 schedule에서는 건너뛴다 → 이 잡에 needs로 걸린 잡도 모두 건너뛴다(long-sim만 돈다).
    if: github.event_name != 'schedule'
    # PR이 아니면(develop push, workflow_dispatch) 필터 없이 전부 돈다.
    outputs:
      engine: ${{ github.event_name != 'pull_request' || steps.f.outputs.engine == 'true' }}
      relay: ${{ github.event_name != 'pull_request' || steps.f.outputs.relay == 'true' }}
      client: ${{ github.event_name != 'pull_request' || steps.f.outputs.client == 'true' }}
      server: ${{ github.event_name != 'pull_request' || steps.f.outputs.server == 'true' }}
    steps:
      # PR에서는 paths-filter가 API로 변경 파일 목록을 읽는다(체크아웃 불필요).
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: f
        timeout-minutes: 3
        with:
          filters: |
            engine:
              - 'client/src-tauri/**'
              - '.github/workflows/ci.yml'
            relay:
              - 'relay/**'
              - 'client/src-tauri/src/net/**'
              - '.github/workflows/ci.yml'
            client:
              - 'client/**'
              - '!client/src-tauri/**'
              - 'server/src/lib/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            server:
              - 'server/**'
              - 'docs/migrations/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  rust:
    # 결정적 테스트만 돈다: 단위 테스트(가상 시간 시뮬레이션 포함) + 벽시계 품질 임계가 없는 통합 테스트.
    # 실패하면 재시도 없이 실패 = 회귀로 본다.
    name: Rust engine (Windows)
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: client/src-tauri
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
        with:
          workspaces: client/src-tauri
      - name: Placeholder frontend dist (tauri::generate_context! 요구)
        timeout-minutes: 1
        run: mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html
      - name: Clippy
        timeout-minutes: 20
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (결정적)
        timeout-minutes: 20
        run: cargo test
        env:
          # 장시간 시뮬레이션 짧은 버전(6피어 5분, P1-6)의 리포트 위치
          SIM_REPORT_DIR: ${{ runner.temp }}/sim-report
      - name: Upload sim report (실패 시)
        if: failure()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: sim-report-short-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sim-report/
          retention-days: 14
          if-no-files-found: ignore

  long-sim:
    # 장시간 시뮬레이션(P1-6): 6피어 풀메시 60분 가상 시간(결정적, 디버그 빌드 로컬 약 8분 — 러너는 더 느릴 수 있다). GOAL 1·2절 수치를 자동 판정해
    # Markdown·JSON 리포트를 남긴다. 야간 schedule과 수동 실행(long_sim 입력)에서만 돈다.
    # 리포트는 성공해도 올린다(추세 비교용). 실패 = GOAL 미달 또는 알려진 미달의 악화.
    name: Long sim (6피어 60분, Windows)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.long_sim)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: client/src-tauri
    env:
      SIM_REPORT_DIR: ${{ runner.temp }}/sim-report
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
        with:
          workspaces: client/src-tauri
      - name: Placeholder frontend dist (tauri::generate_context! 요구)
        timeout-minutes: 1
        run: mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html
      - name: Build tests
        timeout-minutes: 20
        run: cargo test --lib --no-run
      - name: Long sim (60분)
        timeout-minutes: 50
        run: cargo test --lib long_sim_6peers_60min -- --ignored --nocapture
      - name: Job summary
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        run: cat "$SIM_REPORT_DIR/sim-report-long-60min.md" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload sim report
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: sim-report-long-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sim-report/
          retention-days: 30
          if-no-files-found: warn

  realtime:
    # 벽시계 의존 통합 테스트(tests/*.rs의 `#[ignore = "realtime: ..."]`)만 돈다. 단위 테스트의 ignore(known-bug 재현)는
    # `kind(test)` 필터로 제외한다. 가짜 장치를 실제 스레드·실제 시계로 돌려 은닉·끊김·지연 임계를 재므로
    # 러너 스케줄링에 흔들린다. 각 테스트는 별도 프로세스에서 하나씩 돌고, 실패하면 최대 2번 더(총 3회) 재시도한다.
    # 3회 모두 실패하면 잡이 실패한다. 재시도 끝에 통과한 테스트는 nextest 요약에 FLAKY로 남는다.
    # 판별: 같은 시나리오의 결정적 짝이 `rust` 잡에 있다. 짝이 녹색인데 여기만 실패하면 실행 환경, 짝도 실패하면 엔진 회귀다.
    name: Rust realtime (Windows, 3회 재시도)
    needs: [changes, rust]
    if: needs.changes.outputs.engine == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: client/src-tauri
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
        with:
          workspaces: client/src-tauri
          key: realtime
      - uses: taiki-e/install-action@v2
        timeout-minutes: 5
        with:
          tool: cargo-nextest
      - name: Placeholder frontend dist (tauri::generate_context! 요구)
        timeout-minutes: 1
        run: mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html
      - name: Build tests
        timeout-minutes: 20
        run: cargo nextest run --no-run
      - name: Realtime tests (직렬, 3회까지)
        timeout-minutes: 20
        run: cargo nextest run -E 'kind(test)' --run-ignored only --retries 2 --test-threads 1 --no-fail-fast --success-output final --failure-output immediate-final

  relay:
    name: Relay (clippy + test)
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
        with:
          workspaces: relay
      - name: Clippy
        timeout-minutes: 10
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        timeout-minutes: 10
        run: cargo test --locked -- --nocapture
      - name: Docker build (push 없음)
        timeout-minutes: 10
        run: docker build -t band-relay:ci .

  client:
    name: Client (build + test)
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        timeout-minutes: 8
      - run: npm run build
        timeout-minutes: 8
        working-directory: client
      - run: npm test
        timeout-minutes: 8
        working-directory: client
      - name: Lint
        timeout-minutes: 5
        run: npm run lint
        working-directory: client

  e2e:
    # 웹(비 Tauri) E2E: Playwright + chromium. Supabase(Auth/REST/Realtime)·서버 API·시그널링 WS·토스 SDK는
    # 전부 브라우저 안에서 가로챈다(client/e2e/mocks). 운영 DB에 접속하지 않고 비밀값도 쓰지 않는다.
    # 가짜 엔드포인트로 따로 빌드한 앱(client/e2e/vite.config.ts)을 vite preview로 띄운다. 실패 시 trace·스크린샷을 올린다.
    # 시각 회귀는 ubuntu에서 *-linux.png 스냅샷과 비교한다(client/e2e/__screenshots__, 경로 규칙은 playwright.config.ts).
    name: Web E2E (Playwright, chromium)
    needs: changes
    if: needs.changes.outputs.client == 'true' || needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        timeout-minutes: 8
        working-directory: .
      - name: Playwright version
        id: pw
        timeout-minutes: 1
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: pw-cache
        timeout-minutes: 3
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install chromium (+ OS deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      - name: Install OS deps (브라우저 캐시 적중)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
        run: npx playwright install-deps chromium
      - name: Typecheck e2e
        timeout-minutes: 3
        run: npm run e2e:typecheck
      - name: E2E
        timeout-minutes: 10
        run: npm run e2e
      # 성공해도 올린다: CI는 retries 1이라 첫 시도 실패 → 재시도 통과(flaky)면 잡이 녹색이다.
      # trace는 실패한 시도만 남으므로(retain-on-failure) flaky 증거가 이 아티팩트에 남는다.
      # 시각 회귀가 실패하면 실제 스크린샷(*-actual.png)도 여기 남는다 — linux 스냅샷 갱신에 쓴다.
      - name: Upload Playwright report + traces
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            client/e2e/.results/
            client/e2e/.report/
          retention-days: 7
          if-no-files-found: ignore
          # 결과 디렉터리 이름이 '.'으로 시작한다(.results/.report) — v4.4부터 숨김 파일은 기본 제외
          include-hidden-files: true

  server:
    name: Server (build + test)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FFMPEG_DIR: ${{ github.workspace }}/.ffmpeg
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: 22
          cache: npm
      # ffmpeg 설치(stem Opus 인코딩 테스트). apt-get이 50분 멈춘 사례가 있어 순서를 바꿨다:
      # 1) 캐시된 정적 바이너리 → 2) 정적 바이너리 다운로드(재시도·시간 제한) → 3) apt(재시도·시간 제한).
      - name: Restore ffmpeg cache
        id: ffmpeg-cache
        timeout-minutes: 3
        uses: actions/cache@v4
        with:
          path: .ffmpeg
          # BtbN 정적 빌드(GPL, libopus 포함). 릴리스 브랜치(n7.1 → n8.1 …)가 돌아가며 사라지므로 파일 이름을
          # 고정하지 않고, 캐시가 없을 때만 latest 릴리스에서 가장 오래된 유지 브랜치를 고른다. 키를 바꾸면 새로 받는다.
          key: ffmpeg-btbn-linux64-gpl-v2
      - name: Download static ffmpeg
        id: ffmpeg-static
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 4
        env:
          # 공개 릴리스 조회용 자동 토큰(리포 secret 아님, 포크 PR에서는 읽기 전용).
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$FFMPEG_DIR"
          asset=$(gh release view latest -R BtbN/FFmpeg-Builds --json assets -q '.assets[].name' \
            | grep -E '^ffmpeg-n[0-9.]+-latest-linux64-gpl-[0-9.]+\.tar\.xz$' | sort -V | head -1)
          echo "asset: $asset"
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 -o /tmp/ffmpeg.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$asset"
          tar -xJf /tmp/ffmpeg.tar.xz -C "$FFMPEG_DIR" --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          "$FFMPEG_DIR/ffmpeg" -hide_banner -encoders | grep -q libopus
      - name: Install ffmpeg via apt (fallback)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true' && steps.ffmpeg-static.outcome != 'success'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          rm -rf "$FFMPEG_DIR"
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60"
          timeout 180 sudo apt-get $APT update
          timeout 300 sudo apt-get $APT install -y --no-install-recommends ffmpeg
      - name: Put ffmpeg on PATH
        timeout-minutes: 1
        run: |
          if [ -x "$FFMPEG_DIR/ffmpeg" ]; then echo "$FFMPEG_DIR" >> "$GITHUB_PATH"; fi
      - name: Check ffmpeg
        timeout-minutes: 1
        run: ffmpeg -hide_banner -version | head -1 && ffmpeg -hide_banner -encoders | grep libopus
      - run: npm ci
        timeout-minutes: 8
      - run: npm run build
        timeout-minutes: 5
        working-directory: server
      - name: Typecheck scripts
        timeout-minutes: 5
        run: npx tsc -p scripts
        working-directory: server
      - run: npm test
        timeout-minutes: 10
        working-directory: server
        env:
          STEM_TEST_REQUIRE_FFMPEG: "1"
