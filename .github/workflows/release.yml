# 데스크톱 설치본 릴리스 (P2-1). 절차: docs/RELEASE.md
#
# v* 태그 push → Windows NSIS 설치본 빌드 + 업데이터 서명 + latest.json → draft 릴리스.
# draft를 사람이 검토 후 Publish 해야 앱의 자동 업데이트(releases/latest/download/latest.json)가 새 버전을 본다.
name: Release (desktop)

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    name: Windows NSIS 설치본
    runs-on: windows-latest
    env:
      # Authenticode 인증서 (P2-2, 아직 없음). 비어 있으면 서명 없이 빌드한다.
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: 태그와 앱 버전 일치 확인
        run: node scripts/bump-version.mjs --check "${{ github.ref_name }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - run: npm ci

      - name: Authenticode 인증서 가져오기 (시크릿이 있을 때만)
        id: sign
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          $conf = Join-Path $env:RUNNER_TEMP 'tauri.signing.conf.json'
          @{ bundle = @{ windows = @{
              certificateThumbprint = $cert.Thumbprint
              digestAlgorithm = 'sha256'
              timestampUrl = $env:TIMESTAMP_URL
          } } } | ConvertTo-Json -Depth 5 | Set-Content -Path $conf -Encoding utf8NoBOM
          "args=--config $conf" >> $env:GITHUB_OUTPUT
          Write-Host "코드 서명 인증서 사용: $($cert.Subject)"

      - name: 코드 서명 없음 안내
        if: env.WINDOWS_CERTIFICATE == ''
        run: echo "::warning::WINDOWS_CERTIFICATE 시크릿이 없어 Authenticode 서명 없이 빌드합니다 (SmartScreen 경고 발생, docs/RELEASE.md)."

      - name: 빌드 + draft 릴리스
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 업데이터 서명 (minisign). 공개키는 tauri.conf.json plugins.updater.pubkey
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 프런트엔드 빌드 env (vite가 번들에 박는다). repo variables 우선, 없으면 secrets
          VITE_SIGNALING_URL: ${{ vars.VITE_SIGNALING_URL || secrets.VITE_SIGNALING_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TOSS_PAYMENTS_CLIENT_KEY: ${{ vars.VITE_TOSS_PAYMENTS_CLIENT_KEY || secrets.VITE_TOSS_PAYMENTS_CLIENT_KEY }}
        with:
          projectPath: client
          tauriScript: npx tauri
          args: --bundles nsis ${{ steps.sign.outputs.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Band ${{ github.ref_name }}
          releaseBody: |
            Windows 설치본: `Band_*_x64-setup.exe`
            기존 사용자는 앱이 자동으로 업데이트를 알립니다 (Publish 이후).
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
